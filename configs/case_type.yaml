# 案类规则 —— 法律成员（赵可）维护，后端启动时自动校验格式。
# ⚠️ 下面是“民间借贷 · 借贷关系认定”的示例占位，案类确定后整体替换。
#
# 字段说明
#   causes        底库里对应的案由名称（以数据审计结果为准）
#   issues        争议问题；每个问题写：关键事实 / 常见表达 / 会导致结论不同的差异
#   synonyms      标准词: [同义表达]，检索时统一成标准词
#   exclude_terms 容易混淆、需要排除或单独提示的情形

id: private-lending
name: 民间借贷纠纷
causes: [民间借贷纠纷]

issues:
  - name: 借贷合意是否成立
    key_facts: [有无借条或借款合同, 聊天记录中是否提及借款, 是否有催款及对方回应]
    terms: [借条, 借款合意, 借贷关系, 催款, 聊天记录]
    differences: [有可相互印证的聊天记录, 仅有转账记录]

  - name: 款项性质（借款 / 赠与 / 其他）
    key_facts: [双方关系, 转账备注, 款项用途]
    terms: [赠与, 转账, 款项性质, 还款]
    differences: [双方为恋人或亲属, 转账备注写明用途]

synonyms:
  借款: [借钱, 欠款]
  转账: [银行转账, 转款, 汇款]
  借条: [欠条, 借据]

exclude_terms: [金融借款, 小额贷款公司]
