# 本地金融借款演示词表；与原有民间借贷演示配置独立。
id: financial-loan
name: 金融借款合同纠纷
causes: [金融借款合同纠纷]
issues:
  - name: 借款履行与提前到期
    key_facts: [贷款发放, 逾期情况, 提前到期条款与通知]
    terms: [金融借款, 借款, 逾期, 提前到期, 提前收回, 还款, 本金]
    differences: [贷款已到期, 按约宣布提前到期]
  - name: 利息罚息及复利
    key_facts: [利率约定, 复利计收方式, 计算明细, 债权人身份]
    terms: [利息, 罚息, 复利, 利率, 违约金]
    differences: [计息方式约定明确, 计算组成不明, 受让人并非金融机构]
  - name: 抵押与保证责任
    key_facts: [抵押登记与顺位, 保证期间, 共同还款承诺, 阶段性担保条件]
    terms: [抵押, 优先受偿, 保证, 保证期间, 担保, 阶段性, 共同还款, 债务加入, 展期]
    differences: [已完成抵押登记, 仅办理预告登记, 约定展期后继续担保]
  - name: 债权转让与实现债权费用
    key_facts: [转让通知, 受让人身份, 律师费约定与实际支出]
    terms: [债权转让, 受让, 律师费, 实际支出, 保全费]
    differences: [费用有发票证明, 请求金额超过实际支出]
  - name: 执行异议与诉讼程序
    key_facts: [异议对象, 关联裁定效力, 起诉代表权限, 再审结果]
    terms: [执行, 评估, 异议, 再审, 提审, 合伙, 表决, 起诉]
    differences: [程序性裁定, 实体判决]
synonyms:
  复利: [复息]
  保证: [担保人]
  提前到期: [提前收贷]
  律师费: [律师代理费]
exclude_terms: []
